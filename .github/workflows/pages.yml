name: Daily reading room & podcast

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Rome
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_site.py'
      - 'nhk_easy.py'
      - 'web/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'build_site.py'
      - 'nhk_easy.py'
      - 'web/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Test reading, audio feeds, and existing Kindle delivery
        run: python -m pytest -q
      - name: Install audio tools
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Get the current Pages address
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the latest daily edition
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python build_site.py --base-url "$SITE_URL"
      - name: Upload complete website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website and RSS feeds
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
