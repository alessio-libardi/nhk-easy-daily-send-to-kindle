name: First Kindle delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/first-delivery.yml'

permissions:
  contents: read

# Serializes scheduled runs, manual sends, and retries. A new push must not
# interrupt an email that has already been accepted by Gmail.
concurrency:
  group: nhk-easy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      created: ${{ steps.epub.outputs.created }}
      date: ${{ steps.epub.outputs.date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch articles and build EPUB
        id: epub
        env:
          EDITION_DATE: latest
        run: python nhk_easy.py --date "$EDITION_DATE"
      - name: Keep the EPUB for three days
        if: steps.epub.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nhk-easy-${{ steps.epub.outputs.date }}
          path: |
            dist/*.epub
            dist/edition.json
          if-no-files-found: error
          retention-days: 3

  deliver:
    needs: build
    if: needs.build.outputs.created == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nhk-easy-${{ needs.build.outputs.date }}
          path: dist
      - name: Send via Gmail and save delivery receipt
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          GH_TOKEN: ${{ github.token }}
        run: python send_to_kindle.py
